<!-- انسخ هذا الـ SVG وضعه داخل الـ HTML أو صمّمه في أي محرر -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 160" width="100%" height="160" role="img" aria-label="string lights">
  <defs>
    <!-- gaussian blur for glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- THE STRING / WIRE -->
  <path d="M20 42 C140 8, 260 22, 410 40 C560 58, 680 26, 800 44"
        stroke="#111" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- Bulb groups: stem + glass + subtle glow -->
  <!-- Bulb 1 -->
  <g transform="translate(40,42)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 2 -->
  <g transform="translate(110,34)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#f5c400" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(245,196,0,0.16)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 3 -->
  <g transform="translate(175,36)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 4 -->
  <g transform="translate(245,30)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#f5c400" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(245,196,0,0.16)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 5 (center) -->
  <g transform="translate(320,36)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 6 -->
  <g transform="translate(390,32)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#f5c400" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(245,196,0,0.16)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 7 -->
  <g transform="translate(465,44)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 8 -->
  <g transform="translate(540,36)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#f5c400" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(245,196,0,0.16)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 9 -->
  <g transform="translate(615,38)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 10 -->
  <g transform="translate(690,28)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#f5c400" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(245,196,0,0.16)" filter="url(#glow)"/>
  </g>

  <!-- Bulb 11 -->
  <g transform="translate(760,44)">
    <rect x="-2" y="-8" width="4" height="12" rx="1" fill="#111"/>
    <ellipse cx="0" cy="6" rx="12" ry="14" fill="#ef4444" />
    <ellipse cx="0" cy="6" rx="20" ry="16" fill="rgba(239,68,68,0.18)" filter="url(#glow)"/>
  </g>
</svg>
